services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mkelectrical-laravel-app
    container_name: mkelectrical-laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - laravel
    depends_on:
      db:
        condition: service_healthy
    command: php-fpm

  nginx:
    image: nginx:alpine
    container_name: mkelectrical-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - laravel
    depends_on:
      - app

  db:
    image: mysql:8
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mkelectrical
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3310:3306"        # HeidiSQL: host 127.0.0.1, port 3310 (3306 is your own local MySQL)
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Vue (Vite) dev server. For production run `npm run build` instead.
  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: mkelectrical-node
    environment:
      - CHOKIDAR_USEPOLLING=true
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /var/www/html/node_modules
    ports:
      - "5173:5173"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  dbdata:
    driver: local
